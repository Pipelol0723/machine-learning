<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiro Twin — Consola del gemelo digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#0d0f13; --panel:#151920; --panel2:#11141a; --lateral:#12151b; --cabecera:#11141a;
    --borde:#232833; --borde2:#2c323e; --borde3:#1c212a;
    --tinta:#e6e9ef; --tinta2:#c9d1de; --tinta3:#9aa3b2; --tinta4:#8b93a3; --tinta5:#6f7787; --tinta6:#5d6472;
    --verde:#188038; --verde2:#7bd992; --verdeF:#1a2a1e; --verdeB:#2c5233;
    --naranja:#e8710a; --naranja2:#ffb877; --naranjaF:#1d1512; --naranjaB:#57301c;
    --rojo:#d93025; --rojo2:#f28b82; --rojoF:#1d1413; --rojoB:#4a2622;
    --azul:#1a73e8; --gris:#9aa0a6;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono','Consolas',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  input[type=range]{accent-color:var(--verde)}
  input,select,button{font-family:inherit}
  ::selection{background:var(--verde);color:#fff}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.35}}
  .app{display:flex;min-height:100vh}

  /* ---------- lateral ---------- */
  .lateral{width:246px;flex:none;background:var(--lateral);border-right:1px solid var(--borde);display:flex;flex-direction:column;padding:20px 0}
  .marca{padding:0 20px 20px;border-bottom:1px solid var(--borde);margin-bottom:14px}
  .marca-fila{display:flex;align-items:center;gap:9px}
  .logo{width:24px;height:24px;border-radius:5px;background:var(--verde);display:flex;align-items:center;justify-content:center;font:600 12px var(--mono);color:#fff}
  .marca-tit{font:600 15px/1.1 var(--sans);letter-spacing:-.2px}
  .marca-sub{font:400 11px/1.4 var(--mono);color:var(--tinta5);margin-top:7px}
  nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
  nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:6px;cursor:pointer;font:500 12.5px/1.3 var(--sans);background:transparent;color:var(--tinta3);transition:background .12s,color .12s}
  nav button:hover{background:#1b2029;color:var(--tinta)}
  nav button.on{background:#1e2530;color:#fff}
  nav .n{font:500 10px var(--mono);color:var(--tinta6);width:14px;flex:none}
  nav .et{flex:1}
  nav .punto{width:6px;height:6px;border-radius:50%;flex:none;background:transparent}
  nav button.on .punto{background:var(--verde)}
  .modelo{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--borde)}
  .modelo-tit{font:500 10px var(--mono);color:var(--tinta5);letter-spacing:.6px;margin-bottom:8px}
  .modelo-lista{display:flex;flex-direction:column;gap:6px;font:400 11.5px/1.4 var(--sans);color:var(--tinta3)}
  .modelo-lista div{display:flex;justify-content:space-between;gap:8px}
  .modelo-lista span:last-child{font-family:var(--mono);color:var(--tinta)}

  /* ---------- principal ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 28px;border-bottom:1px solid var(--borde);background:var(--cabecera)}
  header h1{margin:0;font:600 17px/1.2 var(--sans);letter-spacing:-.3px}
  header p{margin:4px 0 0;font:400 12px/1.4 var(--sans);color:var(--tinta4);max-width:620px}
  .reloj-et{font:500 9.5px var(--mono);color:var(--tinta5);letter-spacing:.6px}
  .reloj-v{font:500 14px var(--mono);color:var(--tinta);margin-top:2px}
  .contenido{flex:1;padding:24px 28px 40px;overflow:auto}

  .tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:10px}
  .p16{padding:16px 18px} .p18{padding:18px 20px} .p20{padding:20px 22px}
  .et{font:500 10px var(--mono);color:var(--tinta5);letter-spacing:.6px}
  .rejilla{display:grid;gap:14px}
  .btn{padding:10px 18px;border-radius:7px;border:0;background:var(--verde);color:#fff;font:600 13px var(--sans);cursor:pointer;transition:background .12s}
  .btn:hover{background:#1f9c47}
  .btn-s{padding:7px 13px;border-radius:6px;border:1px solid var(--borde2);background:#1a1f28;color:var(--tinta2);font:500 12px var(--sans);cursor:pointer;transition:border-color .12s,color .12s}
  .btn-s:hover{border-color:#3c4453;color:#fff}
  .btn-n{padding:10px 18px;border-radius:7px;border:1px solid var(--borde2);background:#1a1f28;color:var(--tinta2);font:500 13px var(--sans);cursor:pointer}
  .btn-n:hover{border-color:#3c4453;color:#fff}
  .btn-r{padding:10px 18px;border-radius:7px;border:1px solid var(--rojoB);background:var(--rojoF);color:var(--rojo2);font:500 13px var(--sans);cursor:pointer}
  .btn-r:hover{border-color:#6d3630}
  .btn-a{padding:10px 18px;border-radius:7px;border:0;background:var(--azul);color:#fff;font:600 13px var(--sans);cursor:pointer}
  .btn-a:hover{background:#3a8bf0}
  .nota{font:400 11.5px/1.6 var(--sans);color:var(--tinta4)}
  .cifra{font:600 20px var(--mono)}
  .cifra-g{font:600 22px var(--mono)}
  .subcifra{font:400 11px var(--sans);color:var(--tinta4);margin-top:3px}
  select,input[type=number]{padding:9px 11px;border-radius:6px;border:1px solid var(--borde2);background:var(--panel2);color:var(--tinta);font:500 13px var(--mono);width:100%}
  .aviso{background:var(--naranjaF);border:1px solid var(--naranjaB);border-radius:10px}
  .pastilla{padding:5px 10px;border-radius:20px;background:var(--verdeF);border:1px solid var(--verdeB);color:var(--verde2);font:500 11px var(--mono)}
  .pie-doc{margin-top:26px;padding-top:14px;border-top:1px solid var(--borde);font:400 10.5px/1.6 var(--mono);color:var(--tinta6);max-width:900px}
  @media (max-width:820px){
    .app{flex-direction:column}
    .lateral{width:100%;border-right:0;border-bottom:1px solid var(--borde)}
    nav{flex-direction:row;flex-wrap:wrap}
    nav button{width:auto}
    .modelo{margin-top:14px}
    .contenido{padding:18px 16px 32px}
    header{padding:14px 16px;flex-wrap:wrap;gap:12px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca">
      <div class="marca-fila">
        <div class="logo">S</div>
        <div class="marca-tit">Shiro Twin</div>
      </div>
      <div class="marca-sub">Consola del gemelo digital<br>iot-bridge · v0.4-parcial</div>
    </div>
    <nav id="nav"></nav>
    <div class="modelo">
      <div class="modelo-tit">ESTADO DEL MODELO</div>
      <div class="modelo-lista">
        <div><span>Detector</span><span>RF + retardos</span></div>
        <div><span>Simulador</span><span>Lineal + retardos</span></div>
        <div><span>Reentrenado</span><span style="color:var(--naranja)">hace 41 d</span></div>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <h1 id="titulo"></h1>
        <p id="subtitulo"></p>
      </div>
      <div style="display:flex;align-items:center;gap:18px;flex:none">
        <div style="text-align:right">
          <div class="reloj-et">RELOJ DE SIMULACIÓN</div>
          <div class="reloj-v" id="reloj"></div>
        </div>
        <button class="btn-s" id="flujo" data-act="flujo"></button>
      </div>
    </header>
    <div class="contenido" id="vista"></div>
  </main>
</div>

<script>
"use strict";
/* ============================================================================
   Shiro Twin — consola del lazo de decisión (mockup del Parcial · Corte 1)

   TODAS las cifras marcadas como medidas provienen del cuaderno
   Parcial_Corte1.ipynb y son reproducibles con random_state = 42.
   Las series de consumo en vivo son sintéticas: sirven para animar la
   interfaz, no son datos del dataset.
   ========================================================================= */

/* --- 1. Constantes medidas ------------------------------------------------ */

// Barrido del umbral. Random Forest + retardos, partición temporal,
// 27,4 días continuos, 84 episodios reales (3,1/día). Notebook §4.2.
const TABLA = [
  { u:0.2, alertas:"2,70", det:"97,6", fal:"52,7", f1:"0,28" },
  { u:0.3, alertas:"2,92", det:"91,7", fal:"43,8", f1:"0,35" },
  { u:0.4, alertas:"3,03", det:"86,9", fal:"37,3", f1:"0,47" },
  { u:0.5, alertas:"3,83", det:"75,0", fal:"38,1", f1:"0,57" },
  { u:0.6, alertas:"2,01", det:"45,2", fal:"20,0", f1:"0,40" },
  { u:0.7, alertas:"0,40", det:"11,9", fal:"0,0",  f1:"0,15" }
];

const NOTAS = {
  0.2:"Cobertura casi total, pero más de la mitad de los avisos no corresponden a nada. Las falsas alarmas gastan un recurso que no se recupera: si el sistema molesta, se desinstala.",
  0.3:"Buen equilibrio para quien paga tarifa alta y tolera ruido. Aún 4 de cada 10 avisos son falsos.",
  0.4:"Valor por defecto propuesto: 3,0 notificaciones diarias frente a 3,1 episodios reales por día, con 86,9 % de cobertura. La frecuencia del aviso coincide con la del fenómeno.",
  0.5:"El 0,50 por defecto de cualquier clasificador no tiene nada de especial aquí: pierde 12 puntos de cobertura y genera más notificaciones que 0,40.",
  0.6:"Régimen de aviso ocasional. Se pierde más de la mitad de los eventos reales.",
  0.7:"El sistema deja de ser útil: detecta 12 de cada 100 eventos. Cero falsas alarmas porque casi no avisa."
};

// MAE por franja del regresor. Notebook §2.2 — el error NO es uniforme.
const FRANJAS = [
  { lim:6,  nombre:"Madrugada (00–06)", mae:"7,3"  },
  { lim:12, nombre:"Mañana (06–12)",    mae:"42,1" },
  { lim:18, nombre:"Tarde (12–18)",     mae:"38,2" },
  { lim:24, nombre:"Noche (18–24)",     mae:"34,7" }
];

// Percentil 90 del consumo por mes. Notebook §3.1 — el criterio envejece.
const DERIVA = [
  { mes:"Enero", v:250 }, { mes:"Febrero", v:230 }, { mes:"Marzo", v:180 },
  { mes:"Abril", v:190 }, { mes:"Mayo", v:150 }
];

// Modo degradado, MEDIDO (no estimado): clasificador y simulador reentrenados
// sin los 18 sensores interiores y sin el clima salvo T_out.
const MODO = {
  completo:  { vars:"36 de 36", det:"86,9 %", alertas:"3,0", r2:"+0,557" },
  degradado: { vars:"13 de 36", det:"77,4 %", alertas:"3,5", r2:"+0,560" }
};

// Regresión lineal REAL ajustada sobre las 6 variables del formulario.
// R² temporal 0,536 · MAE 28,85 Wh (el modelo completo de 36 da 0,557 / 28,17).
const LIN = {
  intercepto: 49.181867,
  hora: 0.377166, lights: 0.772628, T2: -0.138795,
  RH_2: -0.800757, T_out: 0.755494, lag1: 0.734332
};

const VISTAS = [
  ["panel","Panel principal","Consumo en vivo y estado del lazo","Estado del gemelo digital sobre el flujo de lecturas cada 10 minutos."],
  ["alerta","Alerta explicada","Alerta con explicación","Por qué el sistema avisó: la regla del árbol que se mantiene en producción como capa de explicación."],
  ["accion","Acción propuesta","Aprobar · ajustar · rechazar","El agente propone y la persona aprueba. Ninguna acción modifica el estado de la casa sin confirmación."],
  ["umbral","Umbral de decisión","Control del usuario","El equilibrio entre cobertura y ruido no tiene óptimo universal: es un control, no una constante del código."],
  ["ingreso","Entrada manual","Estado del hogar","Ejecuta el simulador real sobre un estado introducido a mano, para inspección o depuración."],
  ["historico","Histórico","Episodios y alertas","Registro de episodios detectados, perdidos y falsas alarmas sobre la ventana de despliegue simulada."],
  ["confianza","Baja confianza","Deriva y recalibración","El criterio de anomalía envejece con la estación. El sistema lo declara en vez de disimularlo."],
  ["degradado","Modo degradado","Hogar con pocos sensores","Qué promete el sistema cuando faltan sensores interiores, y qué deja de prometer."]
];

/* --- 2. Estado ------------------------------------------------------------ */

const S = {
  vista:"panel", umbral:0.4, t:0, corriendo:true, decision:null,
  bloque:"00:00–05:00", recalibrado:false, degradado:false,
  entrada:{ hora:19, lights:20, T2:20.4, RH_2:41.2, T_out:8.3, lag1:240 },
  prediccion:null
};

/* --- 3. Utilidades -------------------------------------------------------- */

const n = (x,d) => x.toFixed(d).replace(".", ",");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hFmt = (h,m) => String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");

// Serie sintética: perfil horario realista para animar la interfaz.
function base(h){ if(h<6)return 52; if(h<9)return 130; if(h<12)return 150; if(h<17)return 110; if(h<22)return 195; return 95; }
function ruido(i){ return (Math.sin(i*2.7)*0.5 + Math.sin(i*0.9)*0.5) * 42; }
function wh(i){
  const h = ((i*10)/60 + 8) % 24;
  let v = base(Math.floor(h)) + ruido(i);
  if(i%37===0) v += 260;
  if(i%53===0) v += 180;
  return Math.max(20, v);
}
const prob = v => Math.max(0.01, Math.min(0.99, (v-120)/210));
const franja = h => FRANJAS.find(f => h < f.lim) || FRANJAS[3];

// Sesgo del simulador por cuartil de consumo real (Wh). Notebook §2.2:
// sobreestima los tres cuartiles bajos y subestima el alto.
function sesgo(v){
  if(v < 50)  return  9.8;
  if(v < 60)  return  6.2;
  if(v < 100) return 21.6;
  return -40.6;
}

// Simulador REAL: regresión lineal de 6 variables ajustada sobre el dataset.
function simular(e){
  const num = x => Number(x) || 0;
  return LIN.intercepto
    + LIN.hora   * num(e.hora)   + LIN.lights * num(e.lights)
    + LIN.T2     * num(e.T2)     + LIN.RH_2   * num(e.RH_2)
    + LIN.T_out  * num(e.T_out)  + LIN.lag1   * num(e.lag1);
}

const filaUmbral = () => TABLA.reduce((a,b) => Math.abs(b.u-S.umbral) < Math.abs(a.u-S.umbral) ? b : a);

/* --- 4. Vistas ------------------------------------------------------------ */

function vPanel(c){
  const cols = "grid-template-columns:repeat(auto-fit,minmax(240px,1fr))";
  return `
  <div class="rejilla" style="${cols};margin-bottom:18px">
    <div class="tarjeta p16">
      <div class="et">CONSUMO ACTUAL</div>
      <div style="display:flex;align-items:baseline;gap:7px;margin-top:8px">
        <span style="font:600 30px/1 var(--mono);color:${c.actual>200?"var(--naranja)":"var(--tinta)"}">${Math.round(c.actual)}</span>
        <span style="font:400 13px var(--sans);color:var(--tinta4)">Wh</span>
      </div>
      <div class="nota" style="margin-top:6px">Umbral de anomalía: 200 Wh</div>
    </div>
    <div class="tarjeta p16">
      <div class="et">P(ANOMALÍA)</div>
      <div style="display:flex;align-items:baseline;gap:7px;margin-top:8px">
        <span style="font:600 30px/1 var(--mono);color:${c.tintaP}">${n(c.p,2)}</span>
      </div>
      <div style="height:5px;border-radius:3px;background:var(--borde);margin-top:10px;overflow:hidden">
        <div style="height:100%;border-radius:3px;background:${c.tintaP};width:${(c.p*100).toFixed(0)}%"></div>
      </div>
      <div class="nota" style="margin-top:6px">Umbral del usuario: ${n(S.umbral,2)}</div>
    </div>
    <div class="tarjeta p16">
      <div class="et">FRANJA · INCERTIDUMBRE</div>
      <div style="font:600 19px/1.2 var(--sans);margin-top:8px">${c.fr.nombre}</div>
      <div class="nota" style="margin-top:6px">MAE esperado <span style="font-family:var(--mono);color:var(--tinta)">${c.fr.mae} Wh</span> · el error no es uniforme</div>
    </div>
    <div class="tarjeta p16">
      <div class="et">ESTADO DEL LAZO</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
        <span style="width:9px;height:9px;border-radius:50%;background:${c.tintaP};animation:pulso 1.8s ease-in-out infinite"></span>
        <span style="font:600 16px/1.2 var(--sans)">${c.alerta?"Alerta propuesta":"Vigilando"}</span>
      </div>
      <div class="nota" style="margin-top:6px">${c.alerta
        ? "p(anomalía) cruzó el umbral. Se notifica y se propone una acción diferible; no se ejecuta nada."
        : "Lectura registrada en el histórico sin notificar. El lazo solo interrumpe por encima del umbral."}</div>
    </div>
  </div>

  <div class="tarjeta" style="padding:18px 20px 14px">
    <div style="font:600 13px var(--sans);margin-bottom:8px">Consumo observado · últimas 10 horas</div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;font:400 11px var(--sans);color:var(--tinta4);margin-bottom:12px">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:2px;background:var(--azul)"></span>Consumo real (Wh)</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:2px;background:var(--rojo)"></span>Umbral 200 Wh</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:2px;background:var(--verde)"></span>Predicción del simulador</span>
    </div>
    <div style="position:relative">
      <svg viewBox="0 0 720 210" preserveAspectRatio="none" style="width:100%;height:210px;display:block">
        <line x1="0" y1="55" x2="720" y2="55" stroke="#1e232c" stroke-width="1"></line>
        <line x1="0" y1="167.5" x2="720" y2="167.5" stroke="#1e232c" stroke-width="1"></line>
        <line x1="0" y1="130" x2="720" y2="130" stroke="var(--rojo)" stroke-width="1" stroke-dasharray="5 4"></line>
        <polyline points="${c.serieSim}" fill="none" stroke="var(--verde)" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round"></polyline>
        <polyline points="${c.serieReal}" fill="none" stroke="var(--azul)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>
      <span style="position:absolute;right:2px;top:44px;font:400 10px var(--mono);color:#4f5765">400</span>
      <span style="position:absolute;right:2px;top:119px;font:400 10px var(--mono);color:var(--rojo)">200</span>
      <span style="position:absolute;right:2px;top:156px;font:400 10px var(--mono);color:#4f5765">100</span>
    </div>
    <div style="display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--tinta5);margin-top:4px">
      <span>${c.ejeInicio}</span><span>${c.ejeFin}</span>
    </div>
  </div>

  <div class="rejilla" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:16px">
    <div class="tarjeta p16">
      <div class="et" style="margin-bottom:10px">RENDIMIENTO MEDIDO · 27 DÍAS</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><div class="cifra" style="color:var(--verde)">86,9 %</div><div class="subcifra">eventos reales detectados</div></div>
        <div><div class="cifra" style="color:var(--naranja)">37,3 %</div><div class="subcifra">alertas sin evento detrás</div></div>
        <div><div class="cifra">3,0</div><div class="subcifra">notificaciones al día</div></div>
        <div><div class="cifra">0,557</div><div class="subcifra">R² del simulador (temporal)</div></div>
      </div>
    </div>
    <div class="tarjeta p16">
      <div class="et" style="margin-bottom:10px">REGLA VIGENTE DEL LAZO</div>
      <pre style="margin:0;font:400 11px/1.7 var(--mono);color:var(--tinta2);white-space:pre-wrap">SI  p(anomalía) ≥ ${n(S.umbral,2)}
Y   consumo estimado &gt; 200 Wh
→   notificar + explicar + PROPONER
    la acción NO se ejecuta sin
    aprobación humana</pre>
    </div>
  </div>`;
}

function vAlerta(){
  const filas = [
    ["hora","19,7",1],["franja","Noche (18–24)",0],["día de semana","viernes",0],
    ["lights","30",1],["lag1 (10 min antes)","380 Wh",1],["media última hora","295 Wh",0],
    ["T2 / RH_2","20,4 °C / 41,2 %",0],["T_out","8,3 °C",0]
  ].map(([k,v,alto]) => `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--borde3)">
      <span style="font:400 12px var(--sans);color:var(--tinta4)">${k}</span>
      <span style="font:500 12.5px var(--mono);color:${alto?"var(--naranja2)":"var(--tinta)"}">${v}</span></div>`).join("");

    ["lights","proxy de ocupación",true],
    ["Retardos (7)","consumo propio de la vivienda",true],
    ["Interiores T1–T9 · RH_1–RH_9",d?"no disponibles":"18 sensores activos",!d],
    ["Clima exterior (6)",d?"solo T_out (API pública)":"6 variables activas",!d]
  ].map(([nom,est,ok]) => `<div style="padding:13px 15px;border-radius:8px;background:var(--panel2);border:1px solid ${ok?"var(--borde)":"var(--naranjaB)"}">
      <div style="font:500 12px var(--sans);color:${ok?"var(--tinta)":"var(--naranja)"}">${nom}</div>
      <div class="subcifra">${est}</div></div>`).join("");

  return `
  <div style="max-width:900px">
    <div class="tarjeta p20">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div>
          <div style="font:600 14px var(--sans)">Instrumentación disponible en el hogar</div>
          <div class="nota" style="margin-top:4px">Alterna el modo para ver qué cambia de verdad al perder los sensores interiores</div>
        </div>
        <button class="btn-n" data-act="degradado">${d?"Simular hogar instrumentado":"Simular hogar con pocos sensores"}</button>
      </div>
      <div class="rejilla" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px">${bloques}</div>
    </div>

    <div style="background:${d?"var(--naranjaF)":"var(--panel)"};border:1px solid ${d?"var(--naranjaB)":"var(--borde)"};border-radius:10px;padding:20px 22px;margin-top:16px">
      <div style="font:600 15px var(--sans);color:${d?"var(--naranja)":"var(--verde2)"}">${d?"Modo degradado activo — fiabilidad reducida y declarada":"Modo completo — todas las fuentes disponibles"}</div>
      <div style="font:400 12.5px/1.7 var(--sans);color:var(--tinta2);margin-top:8px;max-width:660px">${d
        ? "Sin sensores interiores el detector pasa de 86,9 % a <strong>77,4 %</strong> de eventos detectados y sube de 3,0 a 3,5 avisos diarios. El simulador, en cambio, <strong>no se degrada</strong> (R² +0,560 frente a +0,557): el consumo reciente de la propia vivienda carga casi toda la información. El sistema sigue proponiendo acciones, pero marca cada estimación como de fiabilidad reducida."
        : "El hogar de referencia tiene los 29 predictores más 7 variables de retardo. Las cifras del panel corresponden a esta configuración y a una única vivienda de 27 días: son un orden de magnitud para dimensionar la interfaz, no una garantía de servicio."}</div>
      <div class="rejilla" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:18px">
        <div><div class="et">VARIABLES ACTIVAS</div><div class="cifra" style="margin-top:5px">${m.vars}</div></div>
        <div><div class="et">EVENTOS DETECTADOS</div><div class="cifra" style="margin-top:5px;color:${d?"var(--naranja)":"var(--verde)"}">${m.det}</div></div>
        <div><div class="et">AVISOS AL DÍA</div><div class="cifra" style="margin-top:5px">${m.alertas}</div></div>
        <div><div class="et">R² DEL SIMULADOR</div><div class="cifra" style="margin-top:5px">${m.r2}</div></div>
      </div>
    </div>

    <div class="nota" style="margin-top:16px;max-width:740px;line-height:1.7">
      <strong style="color:var(--tinta2);font-weight:500">Matiz que corrige una lectura fácil de las importancias.</strong>
      Los sensores interiores concentran el 60,7 % de la importancia del modelo, pero esa cifra <em>no</em> es el coste de perderlos: al reentrenar sin ellos la detección solo baja 9,5 puntos y el simulador no baja nada, porque el consumo reciente es en gran parte redundante con las temperaturas interiores. La brecha de equidad existe, pero es mucho menor de lo que sugiere la importancia agregada — y por eso el modo degradado es una opción real y no un gesto.
    </div>
  </div>`;
}

/* --- 5. Render ------------------------------------------------------------ */

function calc(){
  const N = 60, reales = [], sim = [];
  for(let k=0;k<N;k++){
    const i = S.t + k, v = wh(i);
    reales.push(v);
    // El simulador reproduce el sesgo medido: se queda corto en los picos.
    sim.push(Math.max(15, v + sesgo(v) + Math.sin(i*1.7)*7));
  }
  const y = v => Math.max(6, Math.min(204, 205 - (Math.min(v,520)/520)*195));
  const pts = a => a.map((v,k) => (k/(N-1)*720).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const actual = reales[N-1], p = prob(actual);
  const idx = S.t + N - 1;
  const horaSim = Math.floor((idx*10/60 + 8) % 24), minSim = (idx*10) % 60;
  return {
    actual, p, alerta: p >= S.umbral, fr: franja(horaSim),
    tintaP: p >= S.umbral ? "var(--naranja)" : "var(--verde)",
    serieReal: pts(reales), serieSim: pts(sim),
    ejeInicio: hFmt(Math.floor((S.t*10/60+8)%24), (S.t*10)%60),
    ejeFin: hFmt(horaSim, minSim),
    reloj: "2016-05-27 " + hFmt(horaSim, minSim)
  };
}

const VF = { panel:vPanel, alerta:vAlerta, accion:vAccion, umbral:vUmbral,
             ingreso:vIngreso, historico:vHistorico, confianza:vConfianza, degradado:vDegradado };

function render(){
  const c = calc();
  const def = VISTAS.find(v => v[0] === S.vista) || VISTAS[0];

  document.getElementById("nav").innerHTML = VISTAS.map((v,i) =>
    `<button class="${S.vista===v[0]?"on":""}" data-act="ir" data-v="${v[0]}">
       <span class="n">${String(i+1).padStart(2,"0")}</span><span class="et">${v[1]}</span><span class="punto"></span>
     </button>`).join("");

  document.getElementById("titulo").textContent = def[2];
  document.getElementById("subtitulo").textContent = def[3];
  document.getElementById("reloj").textContent = c.reloj;
  document.getElementById("flujo").textContent = S.corriendo ? "Pausar flujo" : "Reanudar flujo";

  // Conserva el foco y el cursor al re-renderizar mientras se escribe
  const act = document.activeElement;
  const id = act && act.id ? act.id : null;
  const pos = act && act.selectionStart != null ? act.selectionStart : null;

  document.getElementById("vista").innerHTML =
    (VF[S.vista] || vPanel)(c) +
    `<div class="pie-doc">Mockup del punto 4 · Parcial de Corte 1 · Grupo Shiro — Universidad Sergio Arboleda, 26-2.
Las cifras de rendimiento provienen del cuaderno Parcial_Corte1.ipynb (random_state = 42) sobre una única
vivienda durante 27 días de despliegue simulado. La serie de consumo en vivo es sintética y solo anima la interfaz.</div>`;

  if(id){
    const el = document.getElementById(id);
    if(el){ el.focus(); if(pos != null && el.setSelectionRange){ try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  }
}

/* --- 6. Eventos ----------------------------------------------------------- */

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if(!b || b.tagName === "INPUT" || b.tagName === "SELECT") return;
  const a = b.dataset.act;
  if(a === "ir")          S.vista = b.dataset.v;
  else if(a === "flujo")  S.corriendo = !S.corriendo;
  else if(a === "dec")    S.decision = b.dataset.d;
  else if(a === "recalibrar") S.recalibrado = !S.recalibrado;
  else if(a === "degradado")  S.degradado = !S.degradado;
  else if(a === "predecir"){
    const wh_ = simular(S.entrada);
    S.prediccion = { wh: Math.max(15, wh_), p: prob(Math.max(15, wh_)), fr: franja(Number(S.entrada.hora) || 0) };
  }
  else return;
  render();
});

document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  if(el.dataset.act === "umbral"){ S.umbral = parseFloat(el.value); render(); }
  else if(el.dataset.act === "campo"){
    S.entrada[el.dataset.k] = el.value === "" ? "" : Number(el.value);
  }
});

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-act]");
  if(el && el.dataset.act === "bloque"){ S.bloque = el.value; render(); }
});

/* --- 7. Enlace directo a una vista -----------------------------------------
   #alerta, #umbral, … abren la consola en esa pantalla.
   Parámetros opcionales para documentar estados concretos:
   #accion?decision=aprobada   #degradado?degradado=1   #confianza?recalibrado=1
   #panel?pausa=1&t=118  (congela el reloj de simulación, útil para capturas)  */
function aplicarEnlace(){
  const bruto = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(!bruto) return;
  const [vista, consulta] = bruto.split("?");
  if(VISTAS.some(v => v[0] === vista)) S.vista = vista;
  if(!consulta) return;
  const q = new URLSearchParams(consulta);
  if(q.has("decision"))   S.decision   = q.get("decision");
  if(q.has("degradado"))  S.degradado  = q.get("degradado") === "1";
  if(q.has("recalibrado"))S.recalibrado= q.get("recalibrado") === "1";
  if(q.has("umbral"))     S.umbral     = parseFloat(q.get("umbral"));
  if(q.has("t"))          S.t          = parseInt(q.get("t"), 10) || 0;
  if(q.has("pausa"))      S.corriendo  = q.get("pausa") !== "1";
  if(q.has("predecir")){
    const w = Math.max(15, simular(S.entrada));
    S.prediccion = { wh:w, p:prob(w), fr:franja(Number(S.entrada.hora) || 0) };
  }
}
window.addEventListener("hashchange", () => { aplicarEnlace(); render(); });

setInterval(() => { if(S.corriendo){ S.t++; if(S.vista === "panel") render(); } }, 900);
aplicarEnlace();
render();
</script>
